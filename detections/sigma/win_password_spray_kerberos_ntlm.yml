title: Potential Password Spraying Against Active Directory Accounts
id: 9b2d8e41-5a21-4d33-bc47-f2887a110a12
status: experimental
description: |
    Detects multiple failed logon attempts across distinct user accounts originating from a single source IP address within a short timeframe.
    Covers both NTLM (Event 4625 with substatus 0xC000006A) and Kerberos Pre-Authentication failures (Event 4771 with failure code 0x18).
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: acab7667 (SOC Detection Team)
date: 2026-11-08
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    # NTLM bad password (Status 0xC000006A)
    selection_ntlm:
        EventID: 4625
        Status: '0xc000006a'

    # Kerberos pre-authentication failure (Failure Code 0x18 - bad password)
    selection_kerberos:
        EventID: 4771
        FailureCode: '0x18'

    # Filter out local machine accounts and empty IPs
    filter_noise:
        IpAddress|startswith:
            - '-'
            - '127.0.0.1'
            - '::1'
        TargetUserName|endswith: '$'

    timeframe: 10m
    condition: ((selection_ntlm or selection_kerberos) and not filter_noise) | count(TargetUserName) by IpAddress > 5
falsepositives:
    - Misconfigured internal application or single-sign-on service
    - Vulnerability scanner running authenticated credential checks
    - Mobile devices with cached expired domain credentials
level: high
